name: Deadcode Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

jobs:
  deadcode:
    name: Deadcode Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deadcode scan (blocking)
        run: npm run deadcode:ci

      - name: Upload deadcode report (log)
        if: always()
        run: |
          echo "Deadcode scan completed (optional). See logs above for details."