name: EAS Build on Demand

on:
  push:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-build-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-build-ios: ${{ steps.check.outputs.should-build-ios }}
      should-build-android: ${{ steps.check.outputs.should-build-android }}
      build-type: ${{ steps.check.outputs.build-type }}
    steps:
      - name: Check if build should trigger
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          # Initialize outputs
          echo "should-build-ios=false" >> $GITHUB_OUTPUT
          echo "should-build-android=false" >> $GITHUB_OUTPUT
          echo "build-type=none" >> $GITHUB_OUTPUT

          # Check for build keywords
          if [[ "$COMMIT_MSG" =~ \[build\]|\[build\ all\] ]]; then
            echo "should-build-ios=true" >> $GITHUB_OUTPUT
            echo "should-build-android=true" >> $GITHUB_OUTPUT
            echo "build-type=all" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for both iOS and Android"
          elif [[ "$COMMIT_MSG" =~ \[build\ ios\] ]]; then
            echo "should-build-ios=true" >> $GITHUB_OUTPUT
            echo "build-type=ios" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for iOS only"
          elif [[ "$COMMIT_MSG" =~ \[build\ android\] ]]; then
            echo "should-build-android=true" >> $GITHUB_OUTPUT
            echo "build-type=android" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for Android only"
          elif [[ "$COMMIT_MSG" =~ build: ]]; then
            echo "should-build-ios=true" >> $GITHUB_OUTPUT
            echo "should-build-android=true" >> $GITHUB_OUTPUT
            echo "build-type=ci" >> $GITHUB_OUTPUT
            echo "✅ CI Build triggered for both platforms"
          else
            echo "ℹ️ No build keywords found, skipping build"
          fi

  build-ios:
    needs: check-build-trigger
    if: needs.check-build-trigger.outputs.should-build-ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Build iOS
        run: |
          echo "Building iOS for production..."
          eas build --platform ios --profile production-store --non-interactive
          echo "✅ iOS build completed"

      - name: 📤 Submit to App Store Connect
        run: |
          echo "Submitting to App Store Connect..."
          eas submit --platform ios --latest --non-interactive
          echo "✅ Submitted to App Store Connect"

      - name: 💬 Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🍎 **iOS Build & Submit Completed!**\n\n✅ Build completed on EAS\n✅ Submitted to App Store Connect\n📱 Check TestFlight: Available within 10-30 minutes\n🔗 Monitor: https://expo.dev/accounts/rikiglesias/projects/rise-against-hunger-italia'
            })

  build-android:
    needs: check-build-trigger
    if: needs.check-build-trigger.outputs.should-build-android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🤖 Build Android
        run: |
          echo "Building Android for production..."
          eas build --platform android --profile production-store --non-interactive
          echo "✅ Android build completed"

      - name: 📤 Submit to Google Play Store (if configured)
        id: submit-android
        continue-on-error: true
        run: |
          echo "Checking Google Play Store submission..."
          if eas submit --platform android --latest --non-interactive; then
            echo "✅ Submitted to Google Play Store"
            echo "submitted=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Google Play submission skipped (service account not configured)"
            echo "submitted=false" >> $GITHUB_OUTPUT
          fi

      - name: 💬 Comment on commit (Success)
        if: steps.submit-android.outputs.submitted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🤖 **Android Build & Submit Completed!**\n\n✅ Build completed on EAS\n✅ Submitted to Google Play Store\n📱 Check Google Play Console: Available within 1-2 hours\n🔗 Monitor: https://expo.dev/accounts/rikiglesias/projects/rise-against-hunger-italia'
            })

      - name: 💬 Comment on commit (Build only)
        if: steps.submit-android.outputs.submitted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🤖 **Android Build Completed!**\n\n✅ Build completed on EAS\n⚠️ Auto-submit skipped (Google Play service account not configured)\n📋 Manual submit: `eas submit --platform android --latest`\n🔗 Monitor: https://expo.dev/accounts/rikiglesias/projects/rise-against-hunger-italia'
            })

  build-summary:
    needs: [check-build-trigger, build-ios, build-android]
    if: always() && (needs.check-build-trigger.outputs.should-build-ios == 'true' || needs.check-build-trigger.outputs.should-build-android == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Build Summary
        run: |
          echo "🎯 ============================================"
          echo "📱 EAS BUILD SUMMARY"
          echo "🎯 ============================================"
          echo "📋 Build Type: ${{ needs.check-build-trigger.outputs.build-type }}"
          
          if [[ "${{ needs.check-build-trigger.outputs.should-build-ios }}" == "true" ]]; then
            if [[ "${{ needs.build-ios.result }}" == "success" ]]; then
              echo "🍎 iOS: ✅ SUCCESS"
            else
              echo "🍎 iOS: ❌ FAILED"
            fi
          else
            echo "🍎 iOS: ⏭️ SKIPPED"
          fi
          
          if [[ "${{ needs.check-build-trigger.outputs.should-build-android }}" == "true" ]]; then
            if [[ "${{ needs.build-android.result }}" == "success" ]]; then
              echo "🤖 Android: ✅ SUCCESS"
            else
              echo "🤖 Android: ❌ FAILED"
            fi
          else
            echo "🤖 Android: ⏭️ SKIPPED"
          fi
          
          echo "🔗 Monitor: https://expo.dev/accounts/rikiglesias/projects/rise-against-hunger-italia"
          echo "🎯 ============================================"
