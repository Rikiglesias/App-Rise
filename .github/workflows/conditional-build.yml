name: EAS Build on Demand

on:
  push:
    branches: [master, main]

jobs:
  check-build-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      platform: ${{ steps.check.outputs.platform }}
    steps:
      - name: Check if build should trigger
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"
          
          # Check for build keywords - iOS only for now
          if [[ "$COMMIT_MSG" =~ \[build\]|\[build\ all\]|build: ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "platform=ios" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for iOS (Android not configured yet)"
          elif [[ "$COMMIT_MSG" =~ \[build\ ios\] ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "platform=ios" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for iOS only"
          elif [[ "$COMMIT_MSG" =~ \[build\ android\] ]]; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "platform=none" >> $GITHUB_OUTPUT
            echo "❌ Android build requested but not configured yet"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "platform=none" >> $GITHUB_OUTPUT
            echo "ℹ️ No build keywords found, skipping build"
          fi

  build-ios:
    needs: check-build-trigger
    if: needs.check-build-trigger.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          # EXPO_TOKEN must be configured in Repository Settings → Secrets and variables → Actions
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Build iOS
        run: |
          echo "Building iOS for production..."
          eas build --platform ios --profile production-store --non-interactive --no-wait
          echo "✅ iOS build submitted to EAS"

      - name: 💬 Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🍎 **iOS Build Started!**\n\n✅ Build submitted to EAS\n🔗 Check progress: https://expo.dev/accounts/rikiglesias/projects/rise-against-hunger-italia/builds'
            }) 