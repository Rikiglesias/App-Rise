name: EAS Build on Demand

on:
  push:
    branches: [master, main]

jobs:
  check-build-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      platform: ${{ steps.check.outputs.platform }}
    steps:
      - name: Check if build should trigger
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"
          
          # Check for build keywords
          if [[ "$COMMIT_MSG" =~ \[build\]|\[build\ all\]|build: ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "platform=all" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for ALL platforms"
          elif [[ "$COMMIT_MSG" =~ \[build\ android\] ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "platform=android" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for ANDROID"
          elif [[ "$COMMIT_MSG" =~ \[build\ ios\] ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "platform=ios" >> $GITHUB_OUTPUT
            echo "✅ Build triggered for iOS"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "❌ No build keywords found - skipping build"
          fi

  build:
    needs: check-build-trigger
    if: needs.check-build-trigger.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Run EAS Build
        run: |
          PLATFORM="${{ needs.check-build-trigger.outputs.platform }}"
          echo "Building for platform: $PLATFORM"
          eas build --platform $PLATFORM --non-interactive --no-wait

      - name: 📝 Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const platform = '${{ needs.check-build-trigger.outputs.platform }}';
            const sha = context.sha.substring(0, 7);
            const message = `🚀 **EAS Build Started** 
            
            **Platform:** ${platform}
            **Commit:** ${sha}
            **Triggered by:** Keyword in commit message
            
            ⏳ Build in progress... Check [EAS Dashboard](https://expo.dev/) for status.`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            }); 