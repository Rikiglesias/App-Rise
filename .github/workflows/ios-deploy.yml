name: iOS Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Setup Expo CLI
        run: npm install -g @expo/cli

      - name: 📱 Generate iOS native code
        run: npx expo run:ios --no-build-cache

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ios

      - name: 🔑 Create App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🚀 Build and Upload to App Store
        run: |
          cd ios
          bundle exec fastlane release
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: 📄 Upload build logs
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: ios-build-logs
          path: |
            ios/build/
            ios/fastlane/report.xml

      - name: 💬 Notify Success
        if: success()
        run: |
          echo "🎉 iOS build successful! App uploaded to App Store Connect."
