name: 🗄️ Cache Management & Optimization

on:
  schedule:
    # Run every Sunday at 2 AM UTC to clean up old caches
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Cache action to perform'
        required: true
        default: 'cleanup'
        type: choice
        options:
          - cleanup
          - warm-up
          - analyze

env:
  NODE_VERSION: '20.x'
  CACHE_VERSION: 'v2'

jobs:
  # ===================================================================
  # CACHE CLEANUP
  # ===================================================================
  cache-cleanup:
    name: 🧹 Cache Cleanup
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup' || github.event.schedule
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Clean Old Caches
        uses: actions/github-script@v7
        with:
          script: |
            const { data: caches } = await github.rest.actions.getActionsCaches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const oldCaches = caches.actions_caches.filter(cache => 
              new Date(cache.last_accessed_at) < oneWeekAgo
            );

            console.log(`Found ${oldCaches.length} old caches to delete`);

            for (const cache of oldCaches) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
                console.log(`Deleted cache: ${cache.key}`);
              } catch (error) {
                console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
              }
            }

  # ===================================================================
  # CACHE WARM-UP
  # ===================================================================
  cache-warmup:
    name: 🔥 Cache Warm-up
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'warm-up'
    strategy:
      matrix:
        cache-type: [npm, node-modules, expo, eas]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔥 Warm-up ${{ matrix.cache-type }} Cache
        run: |
          case "${{ matrix.cache-type }}" in
            "npm")
              echo "🔥 Warming up npm cache..."
              npm ci --prefer-offline
              ;;
            "node-modules")
              echo "🔥 Warming up node_modules cache..."
              npm ci
              # Create a comprehensive cache by running common commands
              npx tsc --noEmit --skipLibCheck || true
              npx eslint --version || true
              npx prettier --version || true
              ;;
            "expo")
              echo "🔥 Warming up Expo cache..."
              npm install -g @expo/cli@latest
              expo --version
              ;;
            "eas")
              echo "🔥 Warming up EAS cache..."
              npm install -g eas-cli@latest
              eas --version
              ;;
          esac

      - name: 📊 Cache Statistics
        run: |
          echo "📊 Cache warm-up completed for ${{ matrix.cache-type }}"
          du -sh node_modules/ 2>/dev/null || echo "No node_modules found"
          npm cache verify 2>/dev/null || echo "No npm cache found"

  # ===================================================================
  # CACHE ANALYSIS
  # ===================================================================
  cache-analysis:
    name: 📊 Cache Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'analyze'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📊 Analyze Repository Caches
        uses: actions/github-script@v7
        with:
          script: |
            const { data: caches } = await github.rest.actions.getActionsCaches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Total caches: ${caches.total_count}`);

            // Group caches by type
            const cacheTypes = {};
            let totalSize = 0;

            caches.actions_caches.forEach(cache => {
              const type = cache.key.split('-')[0] || 'unknown';
              if (!cacheTypes[type]) {
                cacheTypes[type] = { count: 0, size: 0 };
              }
              cacheTypes[type].count++;
              cacheTypes[type].size += cache.size_in_bytes;
              totalSize += cache.size_in_bytes;
            });

            console.log('\n📊 Cache Analysis:');
            console.log('==================');

            Object.entries(cacheTypes).forEach(([type, stats]) => {
              const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
              console.log(`${type}: ${stats.count} caches, ${sizeMB} MB`);
            });

            const totalSizeMB = (totalSize / 1024 / 1024).toFixed(2);
            console.log(`\nTotal cache size: ${totalSizeMB} MB`);

            // Find oldest and newest caches
            const sortedByDate = caches.actions_caches.sort((a, b) => 
              new Date(a.last_accessed_at) - new Date(b.last_accessed_at)
            );

            if (sortedByDate.length > 0) {
              console.log(`\nOldest cache: ${sortedByDate[0].key} (${sortedByDate[0].last_accessed_at})`);
              console.log(`Newest cache: ${sortedByDate[sortedByDate.length - 1].key} (${sortedByDate[sortedByDate.length - 1].last_accessed_at})`);
            }

      - name: 📈 Generate Cache Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: caches } = await github.rest.actions.getActionsCaches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const report = {
              timestamp: new Date().toISOString(),
              total_caches: caches.total_count,
              total_size_mb: (caches.actions_caches.reduce((sum, cache) => sum + cache.size_in_bytes, 0) / 1024 / 1024).toFixed(2),
              cache_breakdown: {},
              recommendations: []
            };

            // Analyze cache efficiency
            const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const oldCaches = caches.actions_caches.filter(cache => 
              new Date(cache.last_accessed_at) < oneWeekAgo
            );

            if (oldCaches.length > 0) {
              report.recommendations.push(`Consider cleaning ${oldCaches.length} old caches`);
            }

            if (report.total_size_mb > 1000) {
              report.recommendations.push('Cache size is large, consider more aggressive cleanup');
            }

            console.log('📈 Cache Report Generated:');
            console.log(JSON.stringify(report, null, 2));

  # ===================================================================
  # CACHE OPTIMIZATION SUMMARY
  # ===================================================================
  optimization-summary:
    name: 📋 Optimization Summary
    runs-on: ubuntu-latest
    needs: [cache-cleanup, cache-warmup, cache-analysis]
    if: always()
    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🗄️ Cache Management Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.cache-cleanup.result }}" == "success" ]]; then
            echo "✅ Cache cleanup completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.cache-cleanup.result }}" == "skipped" ]]; then
            echo "⏭️ Cache cleanup skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cache cleanup failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.cache-warmup.result }}" == "success" ]]; then
            echo "✅ Cache warm-up completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.cache-warmup.result }}" == "skipped" ]]; then
            echo "⏭️ Cache warm-up skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cache warm-up failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.cache-analysis.result }}" == "success" ]]; then
            echo "✅ Cache analysis completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.cache-analysis.result }}" == "skipped" ]]; then
            echo "⏭️ Cache analysis skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cache analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Optimization Benefits" >> $GITHUB_STEP_SUMMARY
          echo "- Faster CI/CD pipeline execution" >> $GITHUB_STEP_SUMMARY
          echo "- Reduced GitHub Actions minutes usage" >> $GITHUB_STEP_SUMMARY
          echo "- Improved developer experience" >> $GITHUB_STEP_SUMMARY
          echo "- Optimized storage usage" >> $GITHUB_STEP_SUMMARY
