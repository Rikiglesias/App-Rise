# 🛡️ GITHUB RULESET ENTERPRISE - RISE AGAINST HUNGER ITALIA
# Configurazione di protezione repository per Zero Tolerance Policy
# Standard enterprise per sicurezza e qualità garantita

name: 'Enterprise Protection Ruleset'
description: 'Zero Tolerance Policy - Protezione completa repository'

# Target: Protegge i branch master/develop e i rami di release
target: branch
include:
  - 'master'
  - 'develop'
  - 'release/**'

enforcement: active

rules:
  # 🔐 PULL REQUEST PROTECTION
  - type: pull_request
    parameters:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      require_last_push_approval: true

  # 🧪 STATUS CHECKS REQUIRED
  - type: required_status_checks
    parameters:
      required_status_checks:
        - '🎯 Visual Diff - Layout Regression Detection'
        - '🔍 Quality Checks (typescript)'
        - '🔍 Quality Checks (eslint)'
        - '🔍 Quality Checks (prettier)'
        - '🔍 Quality Checks (tests)'
        - 'build'
        - 'test'
        - 'Deadcode Scan'
      strict: true

  # 🚫 FORCE PUSH PROTECTION
  - type: non_fast_forward
    parameters: {}

  # 🔒 DELETE PROTECTION
  - type: deletion
    parameters: {}

  # 📝 COMMIT MESSAGE STANDARDS
  - type: commit_message_pattern
    parameters:
      pattern: "^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?: .{1,50}"
      negate: false
      operator: 'regex'

  # 🔐 COMMIT SIGNATURE (opzionale)
  - type: required_signatures
    parameters:
      required: false

  # 👥 REQUIRED REVIEWERS
  - type: required_reviewers
    parameters:
      required_reviewer_count: 1

  # 🏷️ REQUIRED DEPLOYMENTS (opzionale)
  - type: required_deployments
    parameters:
      required_deployment_environments: []

  # 🔄 UPDATE REQUIREMENTS
  - type: update_allows_fetch_and_merge
    parameters:
      update_allows_fetch_and_merge: false

bypass_actors:
  - actor_id: 1
    actor_type: OrganizationAdmin
    bypass_mode: always

conditions:
  ref_name:
    include:
      - 'refs/heads/master'
      - 'refs/heads/develop'
      - 'refs/heads/release/**'
    exclude: []
