# Supabase CLI config — pin del comportamento verify_jwt per le Edge Functions (fix S6).
# Solo le sezioni rilevanti per questo branch; la CLI applica i default per il resto.
# project_id è l'identificatore LOCALE del progetto (per `supabase start`), NON il ref
# remoto (quello vive nel link `supabase link --project-ref ...`).
project_id = "app-rise"

# delete-account è invocata dal CLIENT autenticato (Authorization: Bearer <jwt utente>):
# le chiavi di firma ES256 richiedono verify_jwt = false sulla piattaforma.
# Il controllo vero è auth.getUser(jwt) nel codice: cancella solo l'utente del token.
[functions.delete-account]
verify_jwt = false

# purge-deletions è predisposta per il Cron (attualmente non schedulato) senza JWT
# utente. Anche qui verify_jwt = false: l'autorizzazione è il segreto x-cron-secret
# verificato nel codice (timingSafeCompare in index.ts), prima di leggere la chiave admin.
[functions.purge-deletions]
verify_jwt = false
